<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded IPC MCP Dash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #a855f7; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --text: #f8fafc; }
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: radial-gradient(circle at top left, #1e1b4b, #0f172a, #000); color: var(--text); padding: 40px 20px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2.2rem; margin: 0; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-attachment: fixed; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600; }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; margin-bottom: 30px; border-left: 4px solid var(--primary); display: flex; align-items: center; justify-content: space-between; }
        .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }
        .tool-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 20px; text-align: left; transition: all 0.3s ease; display: flex; flex-direction: column; }
        .tool-card:hover { transform: translateY(-3px); border-color: var(--primary); background: rgba(255, 255, 255, 0.06); }
        .tool-name { font-size: 1.2rem; font-weight: 600; color: #fff; margin-bottom: 5px; text-transform: capitalize; }
        .tool-desc { font-size: 0.8rem; color: #94a3b8; margin-bottom: 20px; min-height: 2.5em; overflow: hidden; }
        .btn-action { background: linear-gradient(135deg, var(--primary), var(--secondary)); border: none; color: white; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .input-group { margin-bottom: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        input, select { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 10px; color: white; width: 100%; outline: none; font-size: 0.85rem; margin-top: 5px; }
        .console { background: #000; border-radius: 16px; padding: 20px; font-family: 'Courier New', monospace; height: 300px; overflow-y: auto; border: 1px solid #334155; margin-top: 30px; font-size: 0.85rem; }
        .loading-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0.8; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loader" class="loading-overlay"><div class="spinner"></div></div>

<div class="container">
    <header><h1>IPC MCP Native</h1><p style="color: #64748b">Direct API Gateway</p></header>
    <div class="glass-card">
        <div style="display:flex; flex-direction:column; gap:5px">
            <div id="authStatus" style="color:#ef4444; font-size:0.9rem">⚠ Waiting for Authentication</div>
            <div id="tokenLabel" style="color:#94a3b8; font-size:0.75rem; word-break: break-all">Provide <b>?token=xxxx</b> in URL.</div>
        </div>
        <div style="color:#4ade80; font-size:0.8rem; margin-left:20px; white-space:nowrap">Service Mode: Active</div>
    </div>
    <div class="tool-grid" id="toolGrid"></div>
    <div class="console" id="console"></div>
</div>

<script>
    let authToken = "";
    let discoveredUsers = [];

    function log(msg, type = 'info') {
        const console = document.getElementById('console');
        const line = document.createElement('div');
        line.style.borderLeft = '3px solid #6366f1'; line.style.paddingLeft = '10px'; line.style.marginBottom = '5px';
        line.innerHTML = `<span style="color: #64748b">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
        console.appendChild(line); console.scrollTop = console.scrollHeight;
    }

    function cleanSSE(text) {
        return text.replace(/^event: message\ndata: /gm, '').trim();
    }

    async function mcpCall(method, params = {}) {
        const res = await fetch('/mcp', { 
            method: 'POST', 
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
            body: JSON.stringify({ jsonrpc: '2.0', method: method, params: params, id: Date.now() })
        });
        const text = await res.text();
        return JSON.parse(cleanSSE(text));
    }

    async function initAuth() {
        const params = new URLSearchParams(window.location.search);
        authToken = params.get('token') || "";
        
        if (authToken) {
            document.getElementById('authStatus').innerHTML = "✔ Authenticated";
            document.getElementById('authStatus').style.color = "#4ade80";
            document.getElementById('tokenLabel').innerHTML = "Session Token Active";
            
            try {
                const userData = await mcpCall('tools/call', { name: 'list_users', arguments: {} });
                const jsonText = userData.result?.content?.[0]?.text;
                discoveredUsers = jsonText ? JSON.parse(jsonText) : [];
                log(`Loaded ${discoveredUsers.length} system users.`);
            } catch (e) { log("User Discovery failed: " + e.message); }
            
            loadTools();
        } else {
            log("Access Denied: ?token= param required.", "error");
            document.getElementById('loader').style.display = 'none';
        }
    }

    async function loadTools() {
        const grid = document.getElementById('toolGrid');
        grid.innerHTML = '';
        document.getElementById('loader').style.display = 'flex';
        try {
            const data = await mcpCall('tools/list');
            if (data.error) throw new Error(data.error.message);
            data.result.tools.forEach(tool => buildToolCard(tool));
            log(`Discovery Successful: Sync complete.`, 'success');
        } catch (e) { log(`Discovery failure: ` + e.message, 'error'); } 
        finally { document.getElementById('loader').style.display = 'none'; }
    }

    function buildToolCard(tool) {
        const grid = document.getElementById('toolGrid');
        const card = document.createElement('div');
        card.className = 'tool-card';
        let inner = `<div class="tool-name">${tool.name.replace(/_/g, ' ')}</div><div class="tool-desc">${tool.description}</div><div class="input-group">`;
        const props = tool.inputSchema?.properties || {};
        const required = tool.inputSchema?.required || [];
        if (Object.keys(props).length === 0) inner += `<i style="color:#64748b; font-size:0.75rem">No parameters required</i>`;
        
        for (const [key, prop] of Object.entries(props)) {
            inner += `<label style="font-size:0.75rem; color:#94a3b8">${key}${required.includes(key) ? ' *' : ''}</label>`;
            
            if (tool.name === 'login' && key === 'username') {
                inner += `<select data-key="${key}">`;
                discoveredUsers.forEach(u => {
                    const uname = u.username || u.Username || "Unknown";
                    const utype = u.type || u.Type || "Local";
                    inner += `<option value="${uname}">${uname} (${utype})</option>`;
                });
                inner += `</select>`;
            }
            else if (prop.type === 'boolean') { 
                inner += `<select data-key="${key}"><option value="false">False</option><option value="true">True</option></select>`; 
            }
            else { 
                inner += `<input type="${key.includes('pass') ? 'password' : 'text'}" placeholder="${prop.description || key}" data-key="${key}">`; 
            }
        }
        inner += `</div><button class="btn-action" onclick="invokeTool('${tool.name}', this)">Execute</button>`;
        card.innerHTML = inner; grid.appendChild(card);
    }

    async function invokeTool(name, btn) {
        const card = btn.parentElement;
        const args = {};
        card.querySelectorAll('[data-key]').forEach(input => {
            let val = input.value;
            if (input.tagName === 'SELECT' && (val === 'true' || val === 'false')) val = (val === 'true');
            args[input.getAttribute('data-key')] = val;
        });
        log(`Executing <b>${name}</b>...`);
        try {
            const data = await mcpCall('tools/call', { name: name, arguments: args });
            log(`<b>${name} Result:</b><br>${JSON.stringify(data.result?.content?.[0]?.text || data)}`);
        } catch (e) { log(`Execution Error: ` + e.message, 'error'); }
    }
    window.onload = initAuth;
</script>
</body>
</html>
